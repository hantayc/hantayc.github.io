---
layout: default
---
<article class="page-wrap">
  <a class="back-link" href="{{ '/projects/' | relative_url }}"><i class="fas fa-arrow-left"></i> All projects</a>

  <header class="post-header">
    {% if page.header.image %}
      <img class="hero-banner" src="{{ page.header.image | relative_url }}" alt="{{ page.title }}">
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
    {% if page.tags %}
      <div class="project-tags">
        {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      </div>
    {% endif %}
  </header>

  <hr class="post-divider">

  <div class="post-content">
    {{ content }}
  </div>
</article>
