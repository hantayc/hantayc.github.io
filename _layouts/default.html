<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.permalink != '/' %}{{ page.title }} · {{ site.author.name }}{% else %}{{ site.author.name }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.author.name }} · {{ site.tagline }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/headshot.png' | relative_url }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Set theme before paint to avoid flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  {% seo %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-nav" id="top">
    <div class="nav-inner">
      <a class="nav-brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>

      <nav class="nav-links" aria-label="Primary">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>

      <button class="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-name">{{ site.author.name }}</p>
      <nav class="footer-social" aria-label="Social links">
        {% for s in site.data.socials %}
          <a href="{{ s.url }}"{% if s.url contains 'http' %} target="_blank" rel="noopener"{% endif %} aria-label="{{ s.label }}" title="{{ s.label }}">
            <i class="{{ s.icon }}" aria-hidden="true"></i>
          </a>
        {% endfor %}
      </nav>
      <p class="footer-copy">© {{ 'now' | date: "%Y" }} {{ site.author.name }}. Built with Jekyll.</p>
    </div>
  </footer>

  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script>
    (function () {
      var btn = document.querySelector('.theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var next = cur === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
