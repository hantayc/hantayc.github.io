# ---------------------------------------------------------------
# Site basics
# ---------------------------------------------------------------
title: "Taylor Han"
tagline: "Data Scientist"
description: "Taylor Han — Data Scientist specializing in NLP/GenAI, forecasting, and experimentation."

# User site (not a project site), so baseurl stays empty
url: "https://hantayc.github.io"
baseurl: ""

lang: en
timezone: America/New_York

# ---------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------
markdown: kramdown
highlighter: rouge
sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# ---------------------------------------------------------------
# Author / profile
# ---------------------------------------------------------------
author:
  name: "Taylor Han"
  role: "Data Scientist — NLP/GenAI · Forecasting · Experimentation"
  tagline: "I turn messy, real-world data into models and decisions — from applied NLP and GenAI to forecasting and causal experiments, shipped end to end."
  location: "United States"
  education: "M.S. Information & Data Science, UC Berkeley ’25"
  avatar: "/assets/images/headshot.png"
  stats:
    - value: "5+ yrs"
      label: "Data science in industry"
    - value: "NLP · GenAI"
      label: "Applied LLMs, RAG & forecasting"
    - value: "6-figure"
      label: "Cost savings via automation"

# ---------------------------------------------------------------
# Content collections
# ---------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:name/

# ---------------------------------------------------------------
# Defaults
# ---------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  # Keep the old single résumé file in the repo but out of the sitemap,
  # so it isn't discoverable (role-specific résumés are shared directly).
  - scope:
      path: "assets/files/taylor_han_resume.pdf"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project

# ---------------------------------------------------------------
# Exclude
# ---------------------------------------------------------------
exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor
