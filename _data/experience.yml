# Work experience — rendered as a timeline on the homepage.

- company: Corebridge Financial
  role: Data Scientist
  dates: 2025 – Present
  summary: >
    Digital, customer-experience, and operational analytics for the Individual
    Retirement and Life businesses following their spin-off from AIG.
  bullets:
    - Leading development of a Producer Lifetime Value (PLV) model to quantify the long-term value of distribution producers; currently in the data-engineering phase, profiling source tables across the data lake and running an unsupervised Isolation Forest to surface anomalies.
    - Found that unmodeled segments — notably direct marketers — were skewing the producer distribution, and built a direct-marketer classifier to capture the missing signal and improve the data feeding the model.
    - Reversed double-digit CSAT declines with analytics-driven customer-experience initiatives.
    - Built time-series forecasting models that sharpened workforce and capacity planning.
    - Delivered six-figure cost savings by automating recurring reporting and operational workflows.

- company: AIG
